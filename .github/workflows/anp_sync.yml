name: Sincronizar Bases ANP (Revenda e Distribuição)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Roda toda segunda-feira às 06:00 BRT

permissions:
  contents: write

jobs:
  atualizar-anp:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install requests pandas openpyxl firebase-admin

      - name: Executar atualização e consolidação ANP
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python atualizar_anp.py
